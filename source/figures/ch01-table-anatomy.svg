<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" role="img" aria-label="A table is rows of things, described by columns of facts" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>A table is rows of things, described by columns of facts</title>
  <rect width="760" height="312" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#111111">A table is rows of things, described by columns of facts</text>
  <text x="24" y="76" font-weight="700" fill="#111111">Customers</text>
  <text x="24" y="94" font-size="11.5" fill="#444444">the table</text>
  <!-- column highlight: grey fill, solid border (prints in black and white) -->
  <rect x="230" y="56" width="150" height="192" fill="#e3e3e3" stroke="#111111" stroke-width="2"/>
  <path d="M305 248V268" stroke="#111111" stroke-width="1.25" fill="none"/>
  <text x="305" y="288" text-anchor="middle" fill="#111111">One column = one kind of fact</text>
  <!-- row highlight: dashed heavy border -->
  <rect x="120" y="152" width="400" height="32" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="7 4"/>
  <path d="M520 168H540" stroke="#111111" stroke-width="1.25" fill="none"/>
  <text x="548" y="172" fill="#111111">One row = one customer</text>
  <!-- grid -->
  <g fill="none" stroke-width="1.25">
    <rect x="120" y="56" width="400" height="192" rx="8" stroke="#555555"/>
    <line x1="120" x2="520" y1="88" y2="88" stroke="#555555"/>
    <line x1="120" x2="520" y1="120" y2="120" stroke="#bbbbbb"/>
    <line x1="120" x2="520" y1="184" y2="184" stroke="#bbbbbb"/>
    <line x1="120" x2="520" y1="216" y2="216" stroke="#bbbbbb"/>
    <line x1="230" x2="230" y1="56" y2="248" stroke="#bbbbbb"/>
    <line x1="380" x2="380" y1="56" y2="248" stroke="#bbbbbb"/>
  </g>
  <g fill="#111111">
    <text x="132" y="76" font-weight="700">CustomerID</text><text x="242" y="76" font-weight="700">CustomerName</text><text x="392" y="76" font-weight="700">City</text>
    <text x="132" y="108">1</text><text x="242" y="108">Maya Chen</text><text x="392" y="108">London</text>
    <text x="132" y="140">2</text><text x="242" y="140">Daniel Reed</text><text x="392" y="140">Bristol</text>
    <text x="132" y="172">3</text><text x="242" y="172">Sofia Patel</text><text x="392" y="172">London</text>
    <text x="132" y="204">4</text><text x="242" y="204">Leo Martin</text><text x="392" y="204">Manchester</text>
    <text x="132" y="236">5</text><text x="242" y="236">Amira Hassan</text><text x="392" y="236">Leeds</text>
  </g>
</svg>